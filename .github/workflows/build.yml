name: Build Navora apps
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04     # ships Android SDK + build tools preinstalled
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android SDK licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
      - run: npm ci --legacy-peer-deps
      - run: npx cap sync android
      - name: Build debug APK (install directly on any Android phone)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Build release AAB (for Google Play; signed only if secrets are set)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/navora.keystore
          cd android && ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/navora.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v5
        with:
          name: navora-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Publish build files to the "builds" branch (stable download links)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -e
          mkdir -p /tmp/builds
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/builds/navora-debug.apk
          if ls android/app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then
            cp android/app/build/outputs/bundle/release/*.aab /tmp/builds/navora-release.aab
          fi
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle || echo "0")
          CODE=$(grep -oP 'versionCode \K\d+' android/app/build.gradle || echo "0")
          printf '{"versionName":"%s","versionCode":%s,"commit":"%s","built":"%s"}\n' "$VER" "$CODE" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > /tmp/builds/build.json
          cd /tmp/builds
          git init -q && git checkout -q --orphan builds
          git config user.name "navora-ci" && git config user.email "ci@navora.my"
          git add -A && git commit -qm "Build $CODE ($VER) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds:builds
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: npx cap sync ios
      - name: Build (unsigned archive — sign in Xcode or with your Apple certificates)
        run: |
          cd ios/App && xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/Navora.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation -skipMacroValidation
      - uses: actions/upload-artifact@v5
        with:
          name: navora-ios-archive
          path: ios/App/build/Navora.xcarchive
